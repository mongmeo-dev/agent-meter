name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.release.prerelease == false && github.event.release.draft == false }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # v7.0.1 is the current checkout release; actions/checkout does not publish an LTS channel.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare temporary signing keychain
        shell: bash
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/agent-meter-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/agent-meter-developer-id.p12"

          : "${DEVELOPER_ID_CERTIFICATE_BASE64:?DEVELOPER_ID_CERTIFICATE_BASE64 is required}"
          : "${DEVELOPER_ID_CERTIFICATE_PASSWORD:?DEVELOPER_ID_CERTIFICATE_PASSWORD is required}"

          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Build signed release
        shell: bash
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SIGNING_IDENTITY: "Developer ID Application: HONGDAE KIM (3Y3GN487QP)"
        run: |
          set -euo pipefail

          : "${SPARKLE_PUBLIC_KEY:?SPARKLE_PUBLIC_KEY is required}"

          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Published release tag must be a stable semantic version: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          APP_VERSION="$VERSION" \
            APP_BUILD_NUMBER="$VERSION" \
            SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY" \
            REQUIRE_SPARKLE_SIGNATURE=1 \
            SIGNING_MODE=developer-id \
            SIGNING_IDENTITY="$SIGNING_IDENTITY" \
            bash scripts/build-app.sh

      - name: Notarize release app
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077

          APP_DIR="$GITHUB_WORKSPACE/.build/Agent Meter.app"
          NOTARY_KEY_PATH="$RUNNER_TEMP/agent-meter-notary-key.p8"
          NOTARIZATION_ARCHIVE="$RUNNER_TEMP/agent-meter-notarization.zip"

          : "${APPLE_API_PRIVATE_KEY:?APPLE_API_PRIVATE_KEY is required}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID is required}"
          : "${APPLE_API_ISSUER_ID:?APPLE_API_ISSUER_ID is required}"
          if [[ ! -d "$APP_DIR" ]]; then
            printf 'Application bundle not found at %s\n' "$APP_DIR" >&2
            exit 1
          fi

          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$NOTARIZATION_ARCHIVE"
          xcrun notarytool submit "$NOTARIZATION_ARCHIVE" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --timeout 20m
          xcrun stapler staple "$APP_DIR"
          xcrun stapler validate "$APP_DIR"

      - name: Package signed release
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          : "${SPARKLE_PRIVATE_KEY:?SPARKLE_PRIVATE_KEY is required}"
          : "${SPARKLE_PUBLIC_KEY:?SPARKLE_PUBLIC_KEY is required}"

          VERSION="${RELEASE_TAG#v}"
          APP_VERSION="$VERSION" \
            RELEASE_TAG="$RELEASE_TAG" \
            SPARKLE_PRIVATE_KEY="$SPARKLE_PRIVATE_KEY" \
            SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY" \
            REQUIRE_SPARKLE_SIGNATURE=1 \
            bash scripts/release.sh

      - name: Upload release assets
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            ".build/dist/agent-meter-${VERSION}.zip" \
            ".build/dist/appcast.xml" \
            --clobber

      - name: Clean up temporary signing keychain
        if: ${{ always() }}
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/agent-meter-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/agent-meter-developer-id.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/agent-meter-notary-key.p8"
          NOTARIZATION_ARCHIVE="$RUNNER_TEMP/agent-meter-notarization.zip"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH" "$NOTARIZATION_ARCHIVE"
